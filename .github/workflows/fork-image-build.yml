name: Build native fork image

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string
      runner:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      image:
        required: true
        type: string
      publish:
        required: true
        type: boolean

# Permissions are inherited from the caller: read-only for PRs, package write
# for an explicit release. This shared job never requests repository write.
jobs:
  build:
    name: Build and verify ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify native architecture and generate metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$ARCHITECTURE" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          node scripts/generateMetadata.cjs --channel=stable --commit="$SOURCE_SHA"
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platform }}
          load: ${{ !inputs.publish }}
          push: ${{ inputs.publish }}
          tags: ${{ !inputs.publish && format('aiostreams-ci:{0}', inputs.architecture) || '' }}
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true', inputs.image) || '' }}
          provenance: ${{ inputs.publish }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          cache-from: type=gha,scope=fork-image-${{ inputs.architecture }}
          cache-to: type=gha,mode=max,scope=fork-image-${{ inputs.architecture }}
      - name: Verify built image architecture and source
        env:
          PUBLISH: ${{ inputs.publish }}
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          ref="aiostreams-ci:${ARCHITECTURE}"
          if [ "$PUBLISH" = true ]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            ref="${IMAGE}@${IMAGE_DIGEST}"
            docker pull "$ref"
          fi
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker run --rm --network none --entrypoint /nodejs/bin/node "$ref" -e '
            const assert = require("node:assert/strict");
            const metadata = require("/app/resources/metadata.json");
            assert.match(metadata.commitHash, /^[a-f0-9]{7,40}$/);
            assert.ok(process.argv[1].startsWith(metadata.commitHash));
            assert.equal(metadata.version, require("/app/package.json").version);
            console.log(JSON.stringify({version: metadata.version, commitHash: metadata.commitHash}));
          ' "$SOURCE_SHA"
      - name: Export verified digest
        if: inputs.publish
        env:
          IMAGE: ${{ inputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          jq -n --arg image "$IMAGE" --arg sourceSha "$SOURCE_SHA" \
            --arg platform "$PLATFORM" --arg digest "$IMAGE_DIGEST" \
            '{image: $image, sourceSha: $sourceSha, platform: $platform, digest: $digest}' \
            > "$RUNNER_TEMP/digests/${ARCHITECTURE}.json"
      - uses: actions/upload-artifact@v7
        if: inputs.publish
        with:
          name: fork-digest-${{ inputs.architecture }}
          path: ${{ runner.temp }}/digests/${{ inputs.architecture }}.json
          if-no-files-found: error
          retention-days: 1
