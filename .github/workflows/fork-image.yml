name: Fork Image

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fork-image*.yml'
      - '.github/scripts/fork-image*.mjs'
      - '.dockerignore'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'patches/**'
      - 'resources/**'
      - 'scripts/generateMetadata.cjs'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pinned image/release tag. Defaults to fork-YYYYMMDD-<sha>.'
        required: false
        type: string
      platforms:
        description: 'Native platforms: linux/amd64, linux/arm64, or both.'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: string
      create_release:
        description: 'Create or update a private fork GitHub release for this image.'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# PR revisions replace obsolete checks. Release dispatches have unique groups,
# so neither a PR update nor another release cancels a publication.
concurrency:
  group: fork-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Validate image configuration
    if: github.repository == 'omgwtfwow/AIOStreams'
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.config.outputs.image }}
      tag: ${{ steps.config.outputs.tag }}
      source_sha: ${{ steps.config.outputs.source_sha }}
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test release input and provenance checks
        run: node --test .github/scripts/fork-image.test.mjs
      - name: Prepare native matrix and source revision
        id: config
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          INPUT_PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)" node .github/scripts/fork-image.mjs prepare
      - name: Check existing release tag source
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ steps.config.outputs.tag }}
          SOURCE_SHA: ${{ steps.config.outputs.source_sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${IMAGE_TAG}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/${IMAGE_TAG}:refs/tags/${IMAGE_TAG}"
            test "$(git rev-parse "refs/tags/${IMAGE_TAG}^{commit}")" = "$SOURCE_SHA"
          else
            status=$?
            test "$status" -eq 2
          fi

  check:
    name: Check native image (${{ matrix.architecture }})
    if: github.event_name == 'pull_request'
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/fork-image-build.yml
    with:
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      runner: ${{ matrix.runner }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      image: ${{ needs.prepare.outputs.image }}
      publish: false

  publish:
    name: Publish native digest (${{ matrix.architecture }})
    if: github.event_name == 'workflow_dispatch'
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/fork-image-build.yml
    with:
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      runner: ${{ matrix.runner }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      image: ${{ needs.prepare.outputs.image }}
      publish: true

  merge:
    name: Publish verified image index
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      INPUT_TAG: ${{ needs.prepare.outputs.tag }}
      INPUT_PLATFORMS: ${{ inputs.platforms }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: fork-digest-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Merge only the verified source and platform digests
        id: merge
        run: |
          node .github/scripts/fork-image.mjs digests "$RUNNER_TEMP/digests" > "$RUNNER_TEMP/references.txt"
          mapfile -t references < "$RUNNER_TEMP/references.txt"
          annotations=(
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}"
          )
          docker buildx imagetools create --dry-run "${annotations[@]}" "${references[@]}" > "$RUNNER_TEMP/planned-index.json"
          node .github/scripts/fork-image.mjs verify-index "$RUNNER_TEMP/planned-index.json"
          docker buildx imagetools create "${annotations[@]}" \
            --tag "${IMAGE}:${INPUT_TAG}" --metadata-file "$RUNNER_TEMP/index-metadata.json" "${references[@]}"
          digest="$(jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/index-metadata.json")"
          docker buildx imagetools inspect "${IMAGE}@${digest}" --raw > "$RUNNER_TEMP/published-index.json"
          node .github/scripts/fork-image.mjs verify-index "$RUNNER_TEMP/published-index.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${digest} from ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Record pinned fork release
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE_DIGEST: ${{ needs.merge.outputs.digest }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Create or update source-linked release
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo 'Pinned image:'
            echo
            echo '```text'
            echo "${IMAGE}@${IMAGE_DIGEST}"
            echo '```'
            echo
            echo "Source commit: ${SOURCE_SHA}"
            echo
            echo 'Deploy this immutable digest; do not use a mutable fork latest tag.'
          } > "$notes"
          if gh release view "$IMAGE_TAG" >/dev/null 2>&1; then
            gh release edit "$IMAGE_TAG" --title "AIOStreams ${IMAGE_TAG}" --notes-file "$notes"
          else
            gh release create "$IMAGE_TAG" --title "AIOStreams ${IMAGE_TAG}" --notes-file "$notes" --target "$SOURCE_SHA"
          fi
