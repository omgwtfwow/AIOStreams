name: Fork Image

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fork-image.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**'
      - 'patches/**'
      - 'resources/**'
      - 'scripts/generateMetadata.cjs'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pinned image/release tag. Defaults to fork-YYYYMMDD-<sha>.'
        required: false
        type: string
      platforms:
        description: 'Docker platforms to publish.'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: string
      create_release:
        description: 'Create or update a private fork GitHub release for this image.'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build fork image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate metadata
        run: node scripts/generateMetadata.cjs --channel=stable

      - name: Calculate image tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="${INPUT_TAG}"

          if [ -z "${tag}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              tag="pr-${PR_NUMBER}-${short_sha}"
            else
              tag="fork-$(date -u +%Y%m%d)-${short_sha}"
            fi
          fi

          if ! printf '%s' "${tag}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'; then
            echo "Invalid Docker tag: ${tag}" >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/aiostreams:${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,mode=max,scope=fork-image

      - name: Create or update fork release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${IMAGE_TAG} already exists."
          else
            git tag "${IMAGE_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${IMAGE_TAG}"
          fi

          notes="$(mktemp)"
          {
            echo "Pinned image:"
            echo
            echo "\`\`\`text"
            echo "${IMAGE}@${IMAGE_DIGEST}"
            echo "\`\`\`"
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            echo "Deploy this tag explicitly; do not use a mutable fork \`latest\` tag for production QA."
          } > "${notes}"

          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            gh release edit "${IMAGE_TAG}" --title "AIOStreams ${IMAGE_TAG}" --notes-file "${notes}"
          else
            gh release create "${IMAGE_TAG}" --title "AIOStreams ${IMAGE_TAG}" --notes-file "${notes}" --target "${GITHUB_SHA}"
          fi
